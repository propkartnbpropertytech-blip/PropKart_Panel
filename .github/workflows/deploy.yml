name: PropKart Panel CI/CD & Auto-Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile Panel Production Bundle (v1.0.0)
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_SUPABASE_URL: ""

      - name: Verify Frontend Distribution Assets
        run: |
          echo "Verifying panel-dist content:"
          ls -lh dist/
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)

      - name: Verify Server Syntax & Dependencies
        run: |
          cd server
          npm ci
          node --check src/server.js
          node --check src/security/encryption.js

      - name: Deploy Panel & Server to VPS (Native OpenSSH)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo ">>> Initiating VPS deployment for PropKart Panel..."
          TARGET_HOST="${VPS_HOST:-200.234.36.120}"
          TARGET_USER="${VPS_USERNAME:-root}"
          TARGET_PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$TARGET_PORT" -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$VPS_SSH_KEY" ]; then
            echo ">>> Authenticating with dedicated OpenSSH deployment key..."
            echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_CMD="ssh -i ~/.ssh/deploy_key -p $TARGET_PORT -o StrictHostKeyChecking=no $TARGET_USER@$TARGET_HOST"
            SCP_CMD="scp -i ~/.ssh/deploy_key -P $TARGET_PORT -o StrictHostKeyChecking=no"
          elif [ -n "$VPS_PASSWORD" ]; then
            echo ">>> Authenticating with SSH password..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            SSH_CMD="sshpass -p '$VPS_PASSWORD' ssh -p $TARGET_PORT -o StrictHostKeyChecking=no $TARGET_USER@$TARGET_HOST"
            SCP_CMD="sshpass -p '$VPS_PASSWORD' scp -P $TARGET_PORT -o StrictHostKeyChecking=no"
          else
            echo "::error::No SSH credentials configured! Please add VPS_SSH_KEY or VPS_SSH_PASSWORD in GitHub Repository Settings -> Secrets and variables -> Actions."
            echo "Refer to repository README.md for the step-by-step secret setup guide."
            exit 1
          fi

          echo ">>> Transferring panel-dist to /root/propconnect-stack/panel-dist..."
          $SCP_CMD -r dist/* $TARGET_USER@$TARGET_HOST:/root/propconnect-stack/panel-dist/

          echo ">>> Transferring server to /root/propconnect-stack/server..."
          $SCP_CMD -r server/* $TARGET_USER@$TARGET_HOST:/root/propconnect-stack/server/

          echo ">>> Rebuilding API and restarting panel container (Strict Zero-Touch)..."
          $SSH_CMD "cd /root/propconnect-stack && docker compose -f docker-compose.prod.yml up -d --build propconnect-api && docker restart propconnect-panel && docker ps --filter 'name=propconnect-' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' && curl -sI -k https://panel.nbpropertytech.com | head -n 5"

          echo ">>> SUCCESS: PropKart Panel deployed to https://panel.nbpropertytech.com!"
