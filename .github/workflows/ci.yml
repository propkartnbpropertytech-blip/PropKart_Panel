name: PropKart Panel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          VITE_API_URL: https://api-propkart.nbpropertytech.com/api/v1
          VITE_SUPABASE_URL: http://200.234.36.120:8000
