version: '3.8'

networks:
  propkart-forms-net:
    driver: bridge

services:
  propkart-forms-api:
    container_name: propkart-forms-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=${PORT:-5050}
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
    networks:
      - propkart-forms-net

  propkart-connect-frontend:
    container_name: propkart-connect-frontend
    build:
      context: ./connect
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5051:80"
    networks:
      - propkart-forms-net
    depends_on:
      - propkart-forms-api

  propkart-panel-frontend:
    container_name: propkart-panel-frontend
    build:
      context: ./panel
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5052:80"
    networks:
      - propkart-forms-net
    depends_on:
      - propkart-forms-api
